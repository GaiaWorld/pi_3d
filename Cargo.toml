[package]
name = "pi_3d"
version = "1.3.3"
authors = ["baip0002 <2494156981@qq.com>"]
edition = "2021"
description = "3D Framework for Scene."
repository = "https://github.com/GaiaWorld/pi_3d"
license = "MIT OR Apache-2.0"
keywords = ["3d scene"]

[workspace]
members = ["crates/*"]

[features]
# default_features = ["use_bevy"]
use_bevy = []
use_pi_ecs = []
dhat-heap = []    # if you are doing heap profiling
dhat-ad-hoc = []  # if you are doing ad hoc profiling

[dependencies]
pi_scene_context        = { version = "1.3", registry = "yn", path = "crates/pi_scene_context" }
pi_scene_shell          = { version = "1.3", registry = "yn", path = "crates/pi_scene_shell" }
pi_mesh_builder         = { version = "1.3", registry = "yn", path = "crates/pi_mesh_builder" }
# skybox                  = { version = "1.1", registry = "yn", path = "crates/skybox" }
# procedural_texture      = { version = "1.1", registry = "yn", path = "crates/procedural_texture" }
pi_gltf2_load           = { version = "1.3", registry = "yn", path = "crates/gltf2" }
pi_particle_system      = { version = "1.3", registry = "yn", path = "crates/particle_system" }
pi_trail_renderer       = { version = "1.3", registry = "yn", path = "crates/trail" }
pi_node_materials       = { version = "1.3", registry = "yn", path = "crates/node_materials" }
unlit_material          = { version = "1.3", registry = "yn", path = "crates/unlit_material" }
pi_standard_material    = { version = "1.3", registry = "yn", path = "crates/standard_material" }
pi_pbr                  = { version = "1.3", registry = "yn", path = "crates/pbr" }

pi_render               = { version = "0.3", registry = "yn" }
render_utils            = { version = "0.2", registry = "yn" }
render_core             = { version = "0.3", registry = "yn" }
render_derive           = { version = "0.2", registry = "yn" }
render_compile          = { version = "0.3", registry = "yn" }

pi_bevy_render_plugin   = { version = "0.3", registry = "yn" }
pi_bevy_winit_window    = { version = "0.3", registry = "yn" }
pi_bevy_ecs_extend      = { version = "0.3", registry = "yn" }
pi_bevy_asset           = { version = "0.3", registry = "yn" }
pi_bevy_log             = { version = "0.2", registry = "yn" }

pi_scene_math           = { version = "0.0.*", registry = "yn" }
pi_animation            = { version = "0.2", registry = "yn" }
pi_curves               = { version = "*", registry = "yn" }
pi_atom                 = { version = "0.6", features = ["serde"] }
pi_hal                  = { version = "0.3", registry = "yn" }
pi_assets               = "0.15"
pi-async-rt             = "0.2"
pi_wy_rng               = "0.1"
pi_share                = "0.5"
pi_key_alloter          = "0.6"

wgpu                = { version = "0.3", registry = "yn", package = "pi_wgpu" }
pi_world            = { version = "0.2" }
pi_arr              = { version = "0.20" }

log                 = "0.4"
smallvec            = "1.9"
crossbeam           = "0.8"
futures             = "0.3"
bytemuck            = { version = "1.4", features = ["derive"] }
ahash               = "0.8"
pi_slotmap          = "0.2"

[patch.yn]
# pi_gltf                 = { path = "../pi_gltf", features = ["extras"] }
pi_render               = { path = "../pi_render" }
render_utils            = { path = "../pi_render/crates/render_utils" }
render_core             = { path = "../pi_render/crates/render_core" }
render_derive           = { path = "../pi_render/crates/render_derive" }
render_compile          = { path = "../pi_render/crates/render_compile" }
pi_bevy_render_plugin   = { path = "../pi_bevy/crates/render" }
pi_bevy_winit_window    = { path = "../pi_bevy/crates/winit_window" }
pi_bevy_ecs_extend      = { path = "../pi_bevy/crates/ecs_extend" }
pi_bevy_asset           = { path = "../pi_bevy/crates/asset" }
pi_bevy_log             = { path = "../pi_bevy/crates/log" }

pi_animation            = { path = "../pi_animation" }
pi_curves               = { path = "../pi_curves" }

pi_wgpu                 = { path = "../pi_wgpu" }
# pi_egl                  = { path = "../pi_egl" }
# winit                   = { path = "../winit" }
pi_hal                  = { path = "../pi_hal" }
# pi_sdf                  = { path = "../pi_sdf" }
pi_postprocess          = { path = "../pi_postprocess_n"}
pi_scene_math           = { path = "../pi_scene/crates/pi_scene_math" }
pi_gltf                 = { path = "../pi_gltf", features = ["extras"] }

[patch.crates-io]
pi_world                = { path = "../pi_world", features = ["single_thread", "rc"] }
pi_world_macros         = { path = "../pi_world/macros" }
pi_assets               = { path = "../pi_assets" }
pi_map                  = { path = "../pi_map" }
pi_key_alloter          = { path = "../pi_key_alloter" }
# wgpu                    = { path = "../wgpu/wgpu" }
# wgpu-hal                = { path = "../wgpu/wgpu-hal" }
# naga                    = { path = "../wgpu/naga" }
fixedbitset             = { path = "../fixedbitset"}

[dev-dependencies]
# winit           = { version = "0.28", registry = "yn", path = "../winit"}
wgpu            = { version = "0.3", registry = "yn", package = "pi_wgpu" }
# wgpu            = { version = "0.3", registry = "yn", package = "pi_wgpu", features = ["use_wgpu"] }
pi_winit        = {version = "0.28", registry="yn", package="winit"}
rand            = "0.8"
ktx             = "0.3"
# jemallocator    = "0.5"

dhat            = "0.3"

pi_postprocess      = { version = "0.3", registry = "yn" }

pi_gltf             = { path = "../pi_gltf", features = ["extras"] }
env_logger          = "0.9"
# pi_wgpu         = { version = "*", features = ["single_thread", "use_wgpu"] }
pi_time             = "0.5"
pi_scene_shell      = { path = "./crates/pi_scene_shell", features = ["record_shader"]}

[profile.release]
debug = true
# opt-level = "z"  # 默认情况下，对LLVM的优化通道进行了调整，以提高速度，而不是大小。我们可以通过修改以下
# panic = 'abort'
# split-debuginfo = '...'  # Platform-specific.
strip = true
# debug-assertions = true
# overflow-checks = false
lto = true
# incremental = false
# codegen-units = 1
# rpath = false

